[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "security-evidence-validator"
version = "1.1.0"
requires-python = ">=3.13"
dependencies = ["jsonschema==4.26.0"]
[project.scripts]
sev = "sev.cli:main"
[tool.setuptools.packages.find]
include = ["sev*"]
[tool.setuptools.package-data]
sev = ["*.json"]
